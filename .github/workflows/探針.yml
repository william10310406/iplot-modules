# M7 Task 0 的探針：只讀不寫，不收任何東西、不登記任何名字。Task 0 做完就刪掉。
name: 探針
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.12
      - name: Python 的版本（第 8 項）
        run: |
          which python3.10 && python3.10 --version
          python --version
      - name: 內文、標籤、附件的轉址（第 1、2、3 項）
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "${N:-}" ]; then echo "沒有 issue 號碼（手動跑的）"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$N" > issue.json
          python -I -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print("標籤：", [l["name"] for l in d["labels"]]); print("開的人：", d["user"]["login"], d["user"]["id"], d["user"]["type"], d["author_association"]); print("----- 內文（repr）-----"); print(repr(d["body"])); print("----- 內文 -----"); print(d["body"])' issue.json
          python -I -c 'import json,re,sys; b=json.load(open(sys.argv[1], encoding="utf-8"))["body"] or ""; u=re.findall(r"https://[^\s)\]>\"]+", b); print("\n".join(u))' issue.json > urls.txt
          echo "----- 內文裡的網址 -----"; cat urls.txt
          url="$(grep -E '\.zip$' urls.txt | head -1 || true)"
          if [ -z "$url" ]; then url="$(head -1 urls.txt || true)"; fi
          if [ -z "$url" ]; then echo "內文裡沒有網址"; exit 0; fi
          echo "----- 不帶 token 一層一層跟轉址（只印狀態碼與 host）-----"
          cur="$url"; hop=0
          while [ "$hop" -le 5 ]; do
            out="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$cur")"
            code="${out%% *}"; next="${out#* }"
            echo "第 $hop 層：$code $(printf '%s' "$cur" | awk -F/ '{print $3}')"
            case "$code" in 3??) [ -n "$next" ] && [ "$next" != "$out" ] || break; cur="$next"; hop=$((hop+1));; *) break;; esac
          done
          curl -sS -o probe.zip "$cur"
          ls -l probe.zip
          sha256sum probe.zip
          python -I -c 'import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print([(i.filename, hex(i.flag_bits)) for i in z.infolist()][:30])' probe.zip || echo "不是 zip"
