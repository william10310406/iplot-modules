<!doctype html>
<!-- 行事曆的畫面。資料全部經 iplot.py 的 Api（pywebview.api）拿與存；呼叫一律經 call()，排成一條佇列。
     沒有任何外部資源；來自資料（我的日記、LINE）的字一律用 textContent 或 append(字串) 放進去，不把字串當 HTML。
     LINE 的部分一律唯讀（淡綠色左邊線＋「LINE」標籤）；貼的網址只進不出，頁面只拿得到遮過的。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1c1d21; --muted: #6b7080; --line: #dfe2e9; --accent: #d9463e;
  --on-accent: #ffffff; --soft: #f4f5f8; --has: #fdeceb; --today: #d9463e; --lg: #2e9e6b; --lg-soft: #e8f5ee; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #242529; --fg: #ebecf0; --muted: #9a9fae; --line: #34363f; --accent: #f0736b; --soft: #2d2f35;
    --has: #3a2b2b; --today: #f0736b; --lg: #5cc796; --lg-soft: #1f3329; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif; }
button { padding: 3px 10px; border: 1px solid var(--line); border-radius: 7px; background: none; color: var(--fg);
  font: inherit; font-size: 13px; cursor: pointer; }
button.on { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
button:disabled { opacity: .5; }
.bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
#mods { flex: 1; display: flex; gap: 4px; overflow-x: auto; }
#mods button { min-width: 30px; padding: 2px 6px; font-size: 16px; }
.spacer { flex: 1; }
#title { min-width: 120px; text-align: center; font-weight: 600; }
#view { flex: 1; overflow: auto; padding: 8px 10px; }
#status { padding: 3px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; min-height: 22px; }
#status.bad { color: var(--accent); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { color: var(--muted); font-weight: normal; font-size: 12px; padding-bottom: 2px; }
table.month td { height: 64px; border: 1px solid var(--line); vertical-align: top; padding: 2px 4px; cursor: pointer;
  font-size: 12px; overflow: hidden; }
table.month td.blank { border: none; cursor: default; }
table.month td.has { background: var(--has); }
table.month td.today .n { color: var(--on-accent); background: var(--today); border-radius: 9px; padding: 0 5px; }
.n { color: var(--muted); }
.first { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.months h3 { margin: 0 0 2px; font-size: 13px; }
table.mini td { text-align: center; font-size: 11px; height: 19px; cursor: pointer; color: var(--muted); }
table.mini td.has { background: var(--has); color: var(--fg); border-radius: 4px; }
table.mini td.today { outline: 1px solid var(--today); border-radius: 4px; }
.day h2 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.moods { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; }
.moods button { font-size: 18px; padding: 0 6px; }
.moods input { flex: 1; }
input[type=text], input[type=password], textarea { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg); color: var(--fg); font: inherit; }
textarea { min-height: 56px; resize: vertical; }
label.field { display: block; margin: 6px 0 2px; color: var(--muted); font-size: 12px; }
.unreadable { color: var(--accent); font-size: 12px; margin: 2px 0; word-break: break-all; }
.photos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; padding: 6px;
  border: 1px dashed var(--line); border-radius: 8px; min-height: 58px; }
.photos.drag { border-color: var(--accent); background: var(--soft); }
.photo { position: relative; }
.photo img { height: 64px; border-radius: 5px; display: block; }
.photo .noimg { display: block; height: 64px; padding: 20px 6px; background: var(--soft); border-radius: 5px; font-size: 11px; }
.photo button { position: absolute; top: -6px; right: -6px; padding: 0 5px; border-radius: 9px; background: var(--bg); }
.publicrow { margin-top: 8px; }
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: flex; align-items: center; justify-content: center; }
.overlay[hidden] { display: none; }
.box { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; width: min(460px, 92%);
  max-height: 86%; overflow: auto; }
.box p { margin: 0 0 10px; word-break: break-all; }
.box .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 8px; }
.box ul { margin: 0 0 8px; padding-left: 18px; font-size: 12px; }
.box h4 { margin: 8px 0 2px; font-size: 13px; }
.box pre { white-space: pre-wrap; word-break: break-word; max-height: 34vh; overflow: auto; margin: 2px 0 6px; padding: 6px 8px;
  background: var(--soft); border-radius: 7px; font: inherit; font-size: 12px; }
.box hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
.box input[type=password] { margin: 4px 0; }
.warn { color: var(--accent); }
.muted { color: var(--muted); font-size: 12px; }
/* LINE：淡綠色，跟我自己的紅色分開；全部唯讀 */
.ltag { display: inline-block; padding: 0 5px; border-radius: 6px; background: var(--lg); color: #fff; font-size: 10px; line-height: 15px;
  vertical-align: middle; }
sup.lsup { color: var(--lg); font-size: 9px; font-weight: 600; }
table.month td.lineday { background: var(--lg-soft); }
.lrow1 { display: block; border-left: 2px solid var(--lg); padding-left: 3px; color: var(--muted); font-size: 11px; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow1.done { text-decoration: line-through; opacity: .75; }
.lmore { color: var(--lg); font-size: 10px; }
.lmoodmark { opacity: .6; }
table.mini td.lmood { outline: 1px dashed var(--lg); border-radius: 4px; color: var(--fg); opacity: .8; }
table.mini td.litems { color: var(--fg); position: relative; }
table.mini td.litems::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
  border-radius: 50%; background: var(--lg); }
.lmoodrow { margin: 0 0 6px; padding: 3px 8px; border-left: 3px solid var(--lg); background: var(--lg-soft); border-radius: 0 7px 7px 0; }
.linebox { margin: 3px 0 2px; padding: 3px 8px 5px; border-left: 3px solid var(--lg); background: var(--lg-soft); border-radius: 0 7px 7px 0;
  font-size: 13px; }
.linebox .lhead { font-size: 11px; color: var(--muted); margin-bottom: 1px; }
.linebox .lrow { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
.linebox .lrow .when { color: var(--muted); margin-right: 5px; }
.linebox .lrow.done .t { text-decoration: line-through; color: var(--muted); }
.linebox .detail { margin-left: 16px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
#lineStat { font-size: 12px; }
#lineStat.bad { color: var(--accent); border-color: var(--accent); }
#lineStat.ok { border-color: var(--lg); }
.copyrow { margin-top: 10px; }
</style>
</head>
<body>
<div class="bar"><div id="mods"></div><button id="panel" hidden title="主控面板">圖示面板</button></div>
<div class="bar">
  <button id="vYear">年</button><button id="vMonth">月</button><button id="vDay">日</button>
  <button id="prev" title="上一個">‹</button><span id="title"></span><button id="next" title="下一個">›</button>
  <button id="today">今天</button><span class="spacer"></span>
  <button id="lineStat" title="LINE">LINE</button><button id="web">看網頁</button><button id="publish">發佈</button><button id="gear" title="設定">⚙</button>
</div>
<div id="view"></div>
<div id="status"></div>
<div class="overlay" id="ask" hidden><div class="box"><p id="askText"></p><div class="row">
  <button id="askNo">取消</button><button id="askYes" class="on">產生</button></div></div></div>
<div class="overlay" id="info" hidden><div class="box"><p id="infoText"></p><ul id="infoList"></ul><div class="row">
  <button id="infoClose">關閉</button></div></div></div>
<div class="overlay" id="settings" hidden><div class="box">
  <p>資料夾：<span id="folder"></span></p>
  <div class="row"><button id="change">換資料夾</button><button id="reveal">打開資料夾</button>
    <button id="openIndex">打開綜合網頁</button><button id="rebuild">重建全部網頁</button></div>
  <hr>
  <h4><span class="ltag">LINE</span> 接上 LINE bot</h4>
  <p id="lineMasked" class="muted"></p>
  <input id="lineUrl" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 LINE 網址（https://…/j/….json）">
  <div class="row"><button id="lineSave">貼上／更換</button><button id="lineClear">清除</button><button id="lineRefresh">立刻更新</button></div>
  <p id="lineInfo" class="muted"></p>
  <label><input type="checkbox" id="lineAuto"> 自動複製：每次打開，把昨天以前還沒複製的 LINE 內容接進我的日記（略過私人項目與公開的日子）</label>
  <p id="lineAutoMsg" class="muted"></p>
  <p class="muted">網址：私訊 bot『連上iPLoT』拿。網址等於密碼，只存在這個資料夾的 設定.json，這裡只顯示遮過的。LINE 的內容預設只能看；按「複製進我的日記」才會寫進日記。</p>
  <div class="row"><button id="settingsClose">關閉</button></div></div></div>
<div class="overlay" id="copy" hidden><div class="box">
  <h4 id="copyTitle"></h4><div id="copyBody"></div><p id="copyWarn" class="warn"></p>
  <div class="row"><button id="copyNo">取消</button><button id="copyYes" class="on">複製進日記</button></div></div></div>
<div class="overlay" id="sure" hidden><div class="box"><p id="sureText"></p><div class="row">
  <button id="sureNo">取消</button><button id="sureYes" class="on">確定</button></div></div></div>
<input id="files" type="file" multiple accept="image/*" hidden>
<script>
"use strict";
const MOODS = ["😄", "🙂", "😐", "😟", "😢"];
const FIELDS = [["行程", "行程"], ["看到", "看到了什麼"], ["做了", "做了什麼"]];
const WEEK = "日一二三四五六";
const SAVE_AFTER = 1000;  // 打字停 1 秒就存
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
};
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

// 所有 Python 呼叫排成一條佇列：一個做完才送下一個（存與拖圖不會交錯）
let last = Promise.resolve();
const call = (name, ...args) => {
  const p = last.then(() => window.pywebview.api[name](...args));
  last = p.catch(() => null);
  return p.then((r) => { if (r && r.error) say(r.error, true); return r || {}; },
                (e) => { say(String(e && e.message || e), true); return { error: String(e) }; });
};
const say = (text, bad) => { $("status").textContent = text || ""; $("status").className = bad ? "bad" : ""; };

let view = "month", cur = new Date(), todayText = ymd(new Date()), day = null, dirty = false, timer = null;
let lineState = null, lineVersion = null, diaryVersion = null, pollTimer = null, lastMessage = "", lastAuto = "", lineParts = {}, pendingCopy = null, updatingMsg = false;

function setView(v) {
  view = v;
  for (const [id, name] of [["vYear", "year"], ["vMonth", "month"], ["vDay", "day"]]) $(id).className = v === name ? "on" : "";
}

async function go(v, date) {
  if (!(await saveDay())) return;  // 存不進去：留在這一天，字還在輸入框裡
  pollLine();
  if (view === "day" && v !== "day") day = null;
  if (date) cur = date;
  setView(v);
  if (v === "month") return showMonth();
  if (v === "year") return showYear();
  return showDay();
}

async function showMonth() {
  const ym = cur.getFullYear() + "-" + pad(cur.getMonth() + 1);
  const r = await call("month", ym);
  if (r.error) return;
  todayText = r.today || todayText;
  $("title").textContent = cur.getFullYear() + " 年 " + (cur.getMonth() + 1) + " 月";
  const table = el("table", "month"), head = el("tr");
  for (const w of WEEK) head.append(el("th", "", w));
  table.append(head);
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1).getDay();
  const days = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
  let row = el("tr");
  for (let i = 0; i < first; i++) row.append(el("td", "blank"));
  for (let n = 1; n <= days; n++) {
    const info = r.days[pad(n)], L = (r.line || {})[pad(n)], date = new Date(cur.getFullYear(), cur.getMonth(), n), td = el("td");
    td.className = (info ? "has" : L ? "lineday" : "") + (ymd(date) === todayText ? " today" : "");
    td.append(el("span", "n", n));
    if (info && info.mood) td.append(" ", el("span", "", info.mood));
    else if (L && L.mood.source === "line") td.append(" ", ...lineMoodMark(L.mood));   // 我沒選表情才顯示 LINE 的，標「L」
    if (info && info.images) td.append(" ", el("span", "", "🖼"));
    if (info && info.public) td.append(" ", el("span", "", "🌐"));
    if (info && info.first) td.append(el("span", "first", info.first));
    if (L) addLineRows(td, L, Boolean(info && info.first));
    td.addEventListener("click", () => go("day", date));
    row.append(td);
    if ((first + n) % 7 === 0) { table.append(row); row = el("tr"); }
  }
  if (row.children.length) table.append(row);
  $("view").replaceChildren(table);
}

async function showYear() {
  const y = cur.getFullYear(), r = await call("year", String(y));
  if (r.error) return;
  $("title").textContent = y + " 年";
  const grid = el("div", "months");
  for (let m = 1; m <= 12; m++) {
    const box = el("div"), moods = r.months[pad(m)] || {}, table = el("table", "mini"), head = el("tr");
    box.append(el("h3", "", m + " 月"));
    for (const w of WEEK) head.append(el("th", "", w));
    table.append(head);
    const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    let row = el("tr");
    for (let i = 0; i < first; i++) row.append(el("td"));
    for (let n = 1; n <= days; n++) {
      const date = new Date(y, m - 1, n), mood = moods[pad(n)], L = ((r.line || {})[pad(m)] || {})[pad(n)];
      let label = mood === undefined ? n : (mood || "·"), kind = "";
      if (L && !mood) { if (L.source === "line") { label = L.emoji; kind = " lmood"; } else kind = " litems"; }   // 虛線外框＝LINE 的心情；小圓點＝只有事項
      const td = el("td", "", label);
      td.className = (mood !== undefined ? "has" : "") + kind + (ymd(date) === todayText ? " today" : "");
      td.title = m + " 月 " + n + " 日" + (L && !mood ? "（LINE）" : "");
      td.addEventListener("click", () => go("day", date));
      row.append(td);
      if ((first + n) % 7 === 0) { table.append(row); row = el("tr"); }
    }
    if (row.children.length) table.append(row);
    box.append(table);
    grid.append(box);
  }
  $("view").replaceChildren(grid);
}

function touched() {
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(saveDay, SAVE_AFTER);
}

// 存這一天；沒有要存的或存好了回 true，存不進去回 false（dirty 留著，下一次再試）
async function saveDay() {
  clearTimeout(timer);
  if (!day || !dirty) return true;
  const fields = {};
  if (!day.unreadable["心情"]) { fields.mood = day.mood; fields.note = $("note").value; }
  for (const [key] of FIELDS) if (!day.unreadable[key]) fields[key] = $("f-" + key).value;
  dirty = false;
  const r = await call("save", day.date, fields);
  if (r.error) { dirty = true; return false; }  // 字留在輸入框裡，下一次再試
  for (const sentence of r.unreadable || []) say(sentence, true);
  if (!(r.unreadable || []).length) say("已存");
  return true;
}

function photoRow(images) {
  const row = $("photos");
  row.replaceChildren();
  for (const image of images) {
    const box = el("span", "photo");
    if (image.src) {
      const img = el("img");
      img.addEventListener("error", () => img.replaceWith(el("span", "noimg", image.name)));  // 顯示不出來就寫檔名
      img.src = image.src; img.alt = ""; img.title = image.name;
      box.append(img);
    }
    else box.append(el("span", "noimg", image.name));
    const x = el("button", "", "×");
    x.title = "拿掉 " + image.name;
    x.addEventListener("click", async () => { const r = await call("remove_image", day.date, image.name); if (r.images) photoRow(r.images); });
    box.append(x);
    row.append(box);
  }
  const add = el("button", "", "加圖片");
  add.addEventListener("click", () => $("files").click());
  row.append(add);
}

function addFiles(files) {
  const date = day.date;
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = async () => {
      say("加入中：" + file.name);
      const r = await call("add_image", date, file.name, reader.result);
      if (day && day.date === date && r.images) photoRow(r.images);
      if (!r.error) say("已加入：" + file.name);
    };
    reader.readAsDataURL(file);
  }
}

async function showDay() {
  const date = ymd(cur), r = await call("day", date);
  if (r.error) return;
  day = r;
  dirty = false;
  $("title").textContent = (cur.getMonth() + 1) + " 月 " + cur.getDate() + " 日（" + WEEK[cur.getDay()] + "）";
  const box = el("div", "day");
  box.append(el("h2", "", cur.getFullYear() + " 年 " + (cur.getMonth() + 1) + " 月 " + cur.getDate() + " 日"));
  const moods = el("div", "moods");
  if (day.unreadable["心情"]) {
    box.append(el("p", "unreadable", "讀不到這個檔（不是 UTF-8），沒有覆寫它：" + day.unreadable["心情"]));
  } else {
    for (const m of MOODS) {
      const b = el("button", m === day.mood ? "on" : "", m);
      b.addEventListener("click", () => {
        day.mood = day.mood === m ? "" : m;  // 再點一次取消
        for (const other of moods.querySelectorAll("button")) other.className = other.textContent === day.mood ? "on" : "";
        dirty = true;
        saveDay();
      });
      moods.append(b);
    }
    const note = el("input");
    note.type = "text"; note.id = "note"; note.placeholder = "一句話"; note.value = day.note;
    note.addEventListener("input", touched);
    note.addEventListener("blur", saveDay);
    moods.append(note);
    box.append(moods);
  }
  lineParts = { mood: el("div", "lmoodrow") };
  lineParts.mood.hidden = true;
  box.append(lineParts.mood);
  for (const [key, label] of FIELDS) {
    box.append(el("label", "field", label));
    if (day.unreadable[key]) {
      box.append(el("p", "unreadable", "讀不到這個檔（不是 UTF-8），沒有覆寫它：" + day.unreadable[key]), lineBoxFor(key));
      continue;
    }
    const t = el("textarea");
    t.id = "f-" + key; t.value = day[key];
    t.addEventListener("input", touched);
    t.addEventListener("blur", saveDay);
    box.append(t, lineBoxFor(key));
  }
  const copyRow = el("div", "copyrow"), copyBtn = el("button", "", "把這天 LINE 的內容複製進我的日記");
  copyBtn.id = "copyLine"; copyBtn.hidden = true;
  copyBtn.addEventListener("click", openCopy);
  copyRow.append(copyBtn);
  box.append(copyRow);
  const photos = el("div", "photos");
  photos.id = "photos";
  photos.title = "把照片拖進來";
  photos.addEventListener("dragover", (e) => { e.preventDefault(); photos.classList.add("drag"); });
  photos.addEventListener("dragleave", () => photos.classList.remove("drag"));
  photos.addEventListener("drop", (e) => { e.preventDefault(); photos.classList.remove("drag"); addFiles(e.dataTransfer.files); });
  box.append(photos);
  const pub = el("label", "publicrow"), check = el("input");
  check.type = "checkbox"; check.checked = day.public;
  check.addEventListener("change", async () => {
    const r2 = await call("set_public", day.date, check.checked);
    if (r2.error) check.checked = !check.checked; else say(r2.public ? "這一天會放上網路（按「發佈」才產生）" : "這一天不公開");
  });
  pub.append(check, " 公開（按「發佈」時放上網路）");
  box.append(pub);
  $("view").replaceChildren(box);
  photoRow(day.images);
  fillLine();
}

// ── LINE ── 下面全部是唯讀的顯示；LINE 的字一律 textContent／append(字串)，不當 HTML
const lineMoodMark = (m) => {
  const mark = el("span", "lmoodmark", m.emoji);
  mark.title = "來自 LINE" + (m.text ? "：" + m.text : "");
  return [mark, el("sup", "lsup", "L")];
};

function addLineRows(td, L, mineFirst) {
  for (const row of L.lines) {
    const mark = row.kind === "task" ? (row.done ? "☑ " : "☐ ") : "▸ ";
    const r = el("span", "lrow1" + (row.done ? " done" : ""), (row.private ? "🔒 " : "") + mark + row.text);
    r.title = "來自 LINE：" + row.text;
    td.append(r);
  }
  if (L.more) td.append(el("span", "lmore", "LINE +" + L.more));
  else if (mineFirst && L.count) td.append(el("span", "lmore", "LINE ×" + L.count));
}

function lineBoxFor(key) {
  const box = el("div", "linebox");
  box.hidden = true;
  lineParts[key] = box;
  return box;
}

function lineHead() {
  const head = el("div", "lhead");
  head.append(el("span", "ltag", "LINE"), " 來自 LINE（唯讀）");
  return head;
}

function eventRow(e) {
  const row = el("div", "lrow");
  row.append(e.private ? "🔒 " : "", el("span", "when", e.when || ""), el("span", "t", e.title));
  if (e.location) row.append(" @" + e.location);
  if (e.group) row.append(" 〔" + e.group + "〕");
  if (e.note) row.append(el("div", "detail", e.note));
  return row;
}

function taskRow(t) {
  const row = el("div", "lrow" + (t.done ? " done" : ""));
  row.append(t.private ? "🔒 " : "", t.done ? "☑ " : "☐ ", el("span", "t", t.title));
  if (t.time) row.append(el("span", "when", "（截止 " + t.time + "）"));
  if (t.group) row.append(" 〔" + t.group + "〕");
  if (t.note) row.append(el("div", "detail", t.note));
  return row;
}

function jotRow(j) {
  const row = el("div", "lrow");
  row.append(el("span", "when", j.time), j.text);
  return row;
}

function logRows(g) {
  return g.items.map((item) => {
    const row = el("div", "lrow");
    row.append((g.private ? "🔒 " : "") + (g.group ? "〔" + g.group + "〕 " : ""), el("span", "t", item.title));
    if (item.details) row.append(el("div", "detail", item.details));
    return row;
  });
}

// 日檢視的 LINE 部分：只重畫這些唯讀的盒子，不碰我正在打的字
function fillLine() {
  const L = day && day.line;
  if (!L) return;
  const mood = lineParts.mood;
  if (mood) {
    mood.replaceChildren();
    mood.hidden = L.mood.source !== "line";
    if (!mood.hidden) mood.append(el("span", "ltag", "LINE"), " " + L.mood.emoji + (L.mood.text ? " " + L.mood.text : ""));
  }
  const sections = { "行程": [...L.events.map(eventRow), ...L.tasks.map(taskRow)], "看到": L.jots.map(jotRow), "做了": L.logs.flatMap(logRows) };
  for (const [key, rows] of Object.entries(sections)) {
    const box = lineParts[key];
    if (!box) continue;
    box.replaceChildren();
    box.hidden = rows.length === 0;
    if (rows.length) box.append(lineHead(), ...rows);
  }
  const button = $("copyLine");
  if (button) button.hidden = L.empty;
}

// ── 複製進日記（做法 A）：先預覽、你按確定才寫 ──
const skippedText = (s) => {
  const parts = [];
  if (s.private) parts.push(s.private + " 項私人的");
  if (s.already) parts.push(s.already + " 項之前已經複製過");
  if (s.unreadable.length) parts.push("讀不到的欄位：" + s.unreadable.join("、"));
  return parts.length ? "（略過 " + parts.join("、") + "）" : "";
};

async function openCopy() {
  if (!day || !(await saveDay())) return;
  const date = day.date, p = await call("line_copy_preview", date);
  if (p.error) return;
  $("copyTitle").textContent = "把 " + date + " 的 LINE 內容複製進日記";
  const body = $("copyBody");
  body.replaceChildren();
  if (p.empty) {
    body.append(el("p", "", "沒有新的 LINE 內容可以複製" + skippedText(p.skipped)));
  } else {
    for (const [key, label] of FIELDS) {
      if (p.additions[key]) body.append(el("h4", "", label + "：接在原本的內容後面"), el("pre", "", p.additions[key]));
    }
    if (p.mood) {
      body.append(el("h4", "", "心情：只填你還沒填的"), el("pre", "", [p.mood.mood, p.mood.note].filter(Boolean).join(" ")));
    }
    body.append(el("p", "muted", "按「複製進日記」前，原本的內容會先存進這一天的 .history/，找得回來。" + skippedText(p.skipped)));
  }
  $("copyWarn").textContent = p.public ? "這一天勾了「公開」：按「發佈」時，複製進去的 LINE 內容會跟著放上網路（私人的項目已經略過）。" : "";
  $("copyYes").hidden = p.empty;
  pendingCopy = { date, digest: p.digest };
  $("copy").hidden = false;
}

async function confirmCopy() {
  $("copy").hidden = true;
  if (!pendingCopy) return;
  const { date, digest } = pendingCopy;
  pendingCopy = null;
  const r = await call("line_copy", date, digest);
  if (r.error) { if (day && day.date === date) openCopy(); return; }   // 預覽之後內容有變：重新預覽
  say("複製了 " + r.copied + " 項；原本的內容在這一天的 .history/" + (r.warning ? "（" + r.warning + "）" : ""), Boolean(r.warning));
  for (const sentence of r.unreadable || []) say(sentence, true);
  if (day && day.date === date) { dirty = false; await showDay(); }
}

// ── LINE 的狀況：頂端的記號、⚙ 的 LINE 區；忙的時候每秒問一次，不忙就停 ──
function fmtTime(epoch) {
  const d = new Date(epoch * 1000);
  return (ymd(d) === todayText ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " ") + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function renderChip() {
  const s = lineState, chip = $("lineStat");
  if (!s) return;
  let text = "LINE", cls = "", tip = "LINE";
  if (!s.configured) { text = "LINE 未設定"; tip = s.message; }
  else if (s.busy) text = "LINE 更新中…";
  else if (s.message) { text = "LINE ⚠"; cls = "bad"; tip = s.message; }
  else if (s.last_ok_at) { text = "LINE ✓ " + fmtTime(s.last_ok_at); cls = "ok"; tip = "LINE 上次更新：" + fmtTime(s.last_ok_at); }
  chip.textContent = text; chip.className = cls; chip.title = tip;
}

function fillSettings() {
  const s = lineState;
  if (!s) return;
  $("lineMasked").textContent = s.configured ? "目前的網址：" + s.masked_url : "還沒設定網址";
  $("lineClear").disabled = !s.configured;
  $("lineRefresh").disabled = !s.configured || s.busy || s.retry_in > 0;
  $("lineInfo").textContent = [s.busy ? "更新中…" : "", s.last_ok_at ? "上次更新：" + fmtTime(s.last_ok_at) : (s.configured ? "還沒有更新過" : ""),
    s.configured ? s.message : ""].filter(Boolean).join("　");
  $("lineAuto").checked = Boolean(s.auto_copy);
  $("lineAutoMsg").textContent = s.auto_message || "";
}

function applyState(s) {
  lineState = s;
  renderChip();
  fillSettings();
}

// LINE 的資料變了就重畫：月、年整個重畫；日只重畫唯讀的 LINE 盒子（我正在打的字不碰）
async function refreshView() {
  if (view === "month") return showMonth();
  if (view === "year") return showYear();
  if (!day) return;
  const r = await call("day", day.date);
  if (!r.error && day) { day.line = r.line; fillLine(); }
}

async function pollLine() {
  clearTimeout(pollTimer);
  const s = await call("line_state");
  if (s.error) return;
  const dataChanged = s.version !== lineVersion, diaryChanged = diaryVersion !== null && s.diary_version !== diaryVersion;
  lineVersion = s.version;
  diaryVersion = s.diary_version;
  applyState(s);
  if (s.configured && s.message && s.message !== lastMessage) say(s.message, true);
  lastMessage = s.message;
  if (updatingMsg && !s.busy) {   // 我們自己說了「更新中…」：做完要換成結果（失敗的話上面已經說了原因）
    updatingMsg = false;
    if (!s.message && s.last_ok_at) say("LINE 已更新：" + fmtTime(s.last_ok_at));
  }
  if (s.auto_message && s.auto_message !== lastAuto) say(s.auto_message, s.auto_message.includes("存不進"));
  lastAuto = s.auto_message;
  if (dataChanged || diaryChanged) await refreshView();
  if (s.busy || s.retry_in > 0) pollTimer = setTimeout(pollLine, 1000);
}

function sure(text) {
  return new Promise((resolve) => {
    $("sureText").textContent = text;
    $("sure").hidden = false;
    const done = (answer) => { $("sure").hidden = true; $("sureYes").onclick = $("sureNo").onclick = null; resolve(answer); };
    $("sureYes").onclick = () => done(true);
    $("sureNo").onclick = () => done(false);
  });
}

async function saveLineUrl() {
  const url = $("lineUrl").value;
  $("lineUrl").value = "";   // 馬上清掉：頁面不留著網址
  if (!url.trim()) { say("先把網址貼在上面的框框裡", true); return; }
  const r = await call("line_set_url", url);
  if (r.error) return;
  applyState(r);
  say("已設定 LINE 網址，更新中…");
  updatingMsg = true;
  pollLine();
}

async function clearLine() {
  if (!(await sure("清除 LINE 網址，也刪掉這台電腦上 LINE 的快取（不影響你的日記）？"))) return;
  const r = await call("line_clear");
  if (r.error) return;
  applyState(r);
  say("已清除 LINE 網址與快取");
  refreshView();
}

async function refreshLine() {
  const r = await call("line_refresh");
  if (r.error) return;
  applyState(r);
  say("更新 LINE 中…");
  updatingMsg = true;
  pollLine();
}

async function toggleAuto(event) {
  const on = event.target.checked, r = await call("line_set_auto", on);
  if (r.error) { event.target.checked = !on; return; }
  applyState(r);
  say(on ? "自動複製打開了：之後每次打開行事曆，會把昨天以前還沒複製的 LINE 內容接進日記" : "自動複製關掉了");
}

function step(n) {
  if (view === "month") return go("month", new Date(cur.getFullYear(), cur.getMonth() + n, 1));
  if (view === "year") return go("year", new Date(cur.getFullYear() + n, 0, 1));
  return go("day", new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + n));
}

async function loadModules() {
  const r = await call("modules");
  if (r.error) return;
  const bar = $("mods");
  bar.replaceChildren();
  for (const m of r.modules) {
    const b = el("button", "", m.icon);
    b.title = m.title;
    b.addEventListener("click", async () => { const r2 = await call("launch", m.name); if (!r2.error) say("打開「" + m.title + "」"); });
    bar.append(b);
  }
  $("panel").hidden = !r.panel;
}

// 行事曆整天開著：視窗重新拿到焦點時重掃模組列，也重新算今天（過了午夜就換掉「今天」）
function onFocus() {
  loadModules();
  refreshToday();
  pollLine();
}

function refreshToday() {
  const now = ymd(new Date());
  if (now === todayText) return;
  todayText = now;
  if (view !== "day") go(view);  // 月、年檢視重畫，今天的標記換過來；日檢視正在打字，不重畫（「今天」鈕已經用新的日子）
}

async function publish() {
  if (!(await saveDay())) return;
  const s = await call("settings");
  if (s.error) return;
  if (!s.public_days) {  // 沒有公開的日子：回「還沒有打開「公開」的日子」，或拿掉了上一次的 發佈/ 並說一句
    const r = await call("publish");
    if (r.note) say(r.note);
    return;
  }
  $("askText").textContent = "要放上網路的有 " + s.public_days + " 天（只有打開『公開』的日子）。產生發佈用的資料夾？";
  $("ask").hidden = false;
}

async function confirmPublish() {
  $("ask").hidden = true;
  say("產生中…");
  const r = await call("publish");
  if (r.error) return;
  $("infoText").textContent = "放了 " + r.days + " 天到：" + r.folder + "。" + r.note;
  $("infoList").replaceChildren(...(r.problems || []).map((p) => el("li", "", p)));
  $("info").hidden = false;
  say("發佈用的資料夾產生好了");
}

async function openSettings() {
  const s = await call("settings");
  if (s.error) return;
  $("folder").textContent = s.folder;
  $("settings").hidden = false;
  pollLine();
}

function web() {
  if (view === "day") return call("open_page", "day", ymd(cur));
  if (view === "year") return call("open_page", "year", String(cur.getFullYear()));
  return call("open_page", "month", cur.getFullYear() + "-" + pad(cur.getMonth() + 1));
}

function wire() {
  $("vYear").addEventListener("click", () => go("year"));
  $("vMonth").addEventListener("click", () => go("month"));
  $("vDay").addEventListener("click", () => go("day"));
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("today").addEventListener("click", () => go(view, parse(todayText)));
  $("web").addEventListener("click", web);
  $("publish").addEventListener("click", publish);
  $("askNo").addEventListener("click", () => { $("ask").hidden = true; });
  $("askYes").addEventListener("click", confirmPublish);
  $("infoClose").addEventListener("click", () => { $("info").hidden = true; });
  $("gear").addEventListener("click", openSettings);
  $("settingsClose").addEventListener("click", () => { $("settings").hidden = true; });
  $("change").addEventListener("click", async () => {
    if (!(await saveDay())) return;
    const s = await call("change_folder");
    if (s.error) return;
    $("folder").textContent = s.folder;
    go(view);
  });
  $("reveal").addEventListener("click", () => call("reveal_folder"));
  $("openIndex").addEventListener("click", () => call("open_page", "index", ""));
  $("rebuild").addEventListener("click", async () => { const r = await call("rebuild"); if (!r.error) say("重建了 " + r.pages + " 頁"); });
  $("panel").addEventListener("click", () => call("launch", "主控面板"));
  $("files").addEventListener("change", (e) => { if (day) addFiles(e.target.files); e.target.value = ""; });
  window.addEventListener("focus", onFocus);  // 重掃模組列（設計第 15 節第 7 條）、過了午夜換「今天」
  window.addEventListener("pagehide", saveDay);   // 關視窗時盡力再存一次
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => e.preventDefault());  // 拖到別處不要讓瀏覽器打開那張圖
  $("lineStat").addEventListener("click", openSettings);
  $("lineSave").addEventListener("click", saveLineUrl);
  $("lineClear").addEventListener("click", clearLine);
  $("lineRefresh").addEventListener("click", refreshLine);
  $("lineAuto").addEventListener("change", toggleAuto);
  $("copyNo").addEventListener("click", () => { pendingCopy = null; $("copy").hidden = true; });
  $("copyYes").addEventListener("click", confirmCopy);
}

let started = false;
function start() {
  if (started) return;
  started = true;
  wire();
  go("month", new Date());
  loadModules();
  pollLine();
}
if (window.pywebview && window.pywebview.api) start(); else window.addEventListener("pywebviewready", start);
</script>
</body>
</html>
